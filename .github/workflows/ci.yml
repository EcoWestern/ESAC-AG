name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.6 is the minimum supported version (native TypeScript stripping).
        node: ["22.x", "24.x"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The environment is in memory and the model is scripted, so this costs nothing and
      # touches no network. It is the check that says the harness still runs end to end, which
      # matters more here than in a single-turn suite: there are more parts to break.
      - name: Harness self-test
        run: npm run esac -- selftest

      - name: Public pool is reproducible
        run: npm run public:verify
